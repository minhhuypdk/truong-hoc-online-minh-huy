<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Trường Học Online Minh Huy</title><style>
*{box-sizing:border-box}body{margin:0;overflow:hidden;font:15px system-ui;background:#9ed8f6;touch-action:none}canvas{display:block}#top{position:fixed;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;gap:10px;pointer-events:none}.panel{background:#fffffff0;border-radius:16px;padding:12px;color:#174469;box-shadow:0 4px 15px #0002}#pad{position:fixed;bottom:25px;left:22px;width:132px;height:132px;border:3px solid #fffa;border-radius:50%;background:#ffffff65;touch-action:none}#stick{position:absolute;top:37px;left:37px;width:52px;height:52px;border-radius:50%;background:#2976bc;border:3px solid white}#action{position:fixed;right:22px;bottom:50px;background:#ffbc40;color:#173a5c;border:0;border-radius:40px;padding:20px;font-size:16px;font-weight:800}#tip{position:fixed;bottom:177px;left:50%;transform:translateX(-50%);padding:10px 16px;background:#173b64e9;color:white;border-radius:12px;text-align:center;max-width:80vw}#modal{display:none;position:fixed;inset:0;background:#122a4899;align-items:center;justify-content:center;padding:20px}#dialog{background:white;border-radius:22px;padding:24px;max-width:380px;color:#193e61}#dialog button{padding:12px 16px;margin:5px;border:0;border-radius:12px;background:#2369aa;color:white;font-weight:bold}@media(min-width:850px){#pad{opacity:.65}}</style></head><body>
<div id="top"><div class="panel"><b>🏫 TRƯỜNG HỌC MINH HUY</b><div style="font-size:12px">Điện thoại: joystick · Máy tính: WASD</div></div><div class="panel" id="progress">⭐ Gặp Milo</div><div class="panel" id="level">Cấp 1 · 0 XP<div style="height:6px;background:#d8e7f5;border-radius:9px;margin-top:5px"><div id="xpbar" style="height:6px;width:0;background:#2cb17c;border-radius:9px"></div></div></div></div><div id="tip">Tìm Milo 🦉 bên cạnh đài phun nước</div><div id="pad"><div id="stick"></div></div><button id="action">Tương tác</button><div id="modal"><div id="dialog"><h2 id="title"></h2><p id="message"></p><div id="choices"></div><button onclick="document.getElementById('modal').style.display='none'">Đóng</button></div></div>
<script type="module">
import * as THREE from 'https://esm.sh/three@0.170.0';
const scene=new THREE.Scene();scene.background=new THREE.Color('#a5ddfa');scene.fog=new THREE.Fog('#a5ddfa',60,110);
const camera=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,.1,160);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.6));renderer.setSize(innerWidth,innerHeight);document.body.prepend(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xffffff,0x7b9bb6,2.3));const sun=new THREE.DirectionalLight(0xffffff,2);sun.position.set(20,35,15);scene.add(sun);
const mat=c=>new THREE.MeshStandardMaterial({color:c});function box(w,h,d,x,y,z,c){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat(c));m.position.set(x,y,z);scene.add(m);return m}
box(90,.2,90,0,-.15,0,'#83c987');box(7,.05,78,0,.02,0,'#e6d5b5');box(72,.05,7,0,.03,4,'#e6d5b5');
const walls=[];function building(x,z,w,d,h,c){box(w,h,d,x,h/2,z,c);box(w+.7,.6,d+.7,x,h+.2,z,'#f7f8fc');for(let i=-1;i<=1;i++)box(1.8,2,.1,x+i*w/4,3,z+d/2+.08,'#6db2e5');walls.push({x,z,w,d})}
building(0,-24,19,12,11,'#f2ad6d');building(-24,-17,14,11,8,'#bea4ec');building(24,-17,14,11,8,'#90bfea');building(-24,16,14,11,8,'#f6ce72');building(24,16,14,11,8,'#f6a8a8');
const basin=new THREE.Mesh(new THREE.CylinderGeometry(3.4,3.4,.5,32),mat('#fafafa'));basin.position.set(0,.25,13);scene.add(basin);const water=new THREE.Mesh(new THREE.CylinderGeometry(3,3,.05,32),mat('#52c5ed'));water.position.set(0,.54,13);scene.add(water);
for(let i=0;i<20;i++){let x=(i%2?1:-1)*(36+i%3),z=-38+i*4;box(.6,3,.6,x,1.5,z,'#986a48');const crown=new THREE.Mesh(new THREE.SphereGeometry(2.1,9,7),mat('#4f9c5c'));crown.position.set(x,4,z);scene.add(crown)}
const player=new THREE.Group();const body=new THREE.Mesh(new THREE.CapsuleGeometry(.48,.9,5,10),mat('#e95155'));body.position.y=1;player.add(body);const head=new THREE.Mesh(new THREE.SphereGeometry(.44,16,12),mat('#ffd3b2'));head.position.y=2.1;player.add(head);player.position.set(0,0,4);scene.add(player);
const points=[{id:'milo',x:6,z:8,color:'#ffd45a',label:'🦉 Milo'},{id:'book',x:-20,z:-9,color:'#af87e5',label:'📚 Sách bí mật'},{id:'board',x:0,z:-14,color:'#f0925e',label:'📋 Bảng câu đố'},{id:'an',x:-20,z:-10.5,color:'#69c9a9',label:'👩‍🏫 Cô An'},{id:'flower',x:-14,z:3,color:'#ff85bd',label:'🌸 Bông hoa'},{id:'tree',x:-35,z:4,color:'#5bc57a',label:'🌳 Cây tri thức'}];
function orb(p){const m=new THREE.Mesh(new THREE.SphereGeometry(.8,16,12),mat(p.color));m.position.set(p.x,1.1,p.z);scene.add(m)}
for(const p of points){if(p.id!=='milo')orb(p)}
const owl=new THREE.Group();owl.position.set(6,1.2,8);scene.add(owl);
function owlPart(geo,color,x,y,z){const m=new THREE.Mesh(geo,mat(color));m.position.set(x,y,z);owl.add(m);return m}
owlPart(new THREE.SphereGeometry(.94,20,14),'#e8aa42',0,0,0);
owlPart(new THREE.SphereGeometry(.78,20,14),'#ffe1a3',0,-.14,.4);
for(const x of [-.37,.37]){owlPart(new THREE.SphereGeometry(.28,14,12),'#ffffff',x,.27,.76);owlPart(new THREE.SphereGeometry(.12,12,10),'#213c5d',x,.27,.99);const wing=owlPart(new THREE.SphereGeometry(.32,12,10),'#b97932',x*2.8,-.15,0);wing.scale.set(.6,1.3,.5)}
const beak=owlPart(new THREE.ConeGeometry(.17,.38,4),'#ed8535',0,-.12,1.05);beak.rotation.x=Math.PI/2;
for(const x of [-.55,.55])owlPart(new THREE.ConeGeometry(.26,.6,5),'#b97932',x,.86,0);

let state={started:false,clues:[],complete:false,anStarted:false,anClues:[],anComplete:false};try{const s=JSON.parse(localStorage.getItem('minh-huy-school-alpha')||'{}');if(typeof s.started==='boolean'&&Array.isArray(s.clues))state={started:s.started,clues:s.clues.filter(x=>x==='book'||x==='board'),complete:s.complete===true,anStarted:s.anStarted===true,anClues:Array.isArray(s.anClues)?s.anClues.filter(x=>x==='flower'||x==='tree'):[],anComplete:s.anComplete===true}}catch{}
function save(){localStorage.setItem('minh-huy-school-alpha',JSON.stringify(state));update()}function update(){const xp=(state.complete?60:0)+(state.anComplete?40:0),level=1+Math.floor(xp/100);document.getElementById('progress').textContent=state.anComplete?'🏆 Hai nhiệm vụ hoàn thành':state.anStarted?'📗 Cô An: '+state.anClues.length+'/2':state.complete?'🏆 Milo xong · Gặp cô An':state.started?'⭐ Milo: '+state.clues.length+'/2':'⭐ Gặp Milo';document.getElementById('level').firstChild.textContent='Cấp '+level+' · '+xp+' XP';document.getElementById('xpbar').style.width=(xp%100)+'%'}update();
function dialog(title,msg,actions=[]){document.getElementById('title').textContent=title;document.getElementById('message').textContent=msg;const choices=document.getElementById('choices');choices.replaceChildren();for(const [label,fn] of actions){const b=document.createElement('button');b.textContent=label;b.onclick=()=>{document.getElementById('modal').style.display='none';fn()};choices.append(b)}document.getElementById('modal').style.display='flex'}
let near=null;function interact(){if(!near)return;
if(near.id==='an'){if(!state.complete){dialog('👩‍🏫 Cô An','Em hãy hoàn thành nhiệm vụ của Milo trước nhé.');return}
if(!state.anStarted){dialog('👩‍🏫 Cô An','Chào em! Hãy tìm bông hoa ở sân phía Tây và cây tri thức gần hàng cây nhé.',[['Nhận nhiệm vụ',()=>{state.anStarted=true;save()}]])}else dialog('👩‍🏫 Cô An',state.anComplete?'Em đã hoàn thành bài học quan sát thiên nhiên!':'Tìm bông hoa và cây tri thức nhé.');return}
if(near.id==='flower'||near.id==='tree'){if(!state.anStarted){dialog('Chưa có nhiệm vụ','Hãy gặp cô An ở gần thư viện sau khi hoàn thành nhiệm vụ Milo.');return}
if(state.anClues.includes(near.id)){dialog('Đã thu thập','Em đã tìm thấy manh mối này.');return}
const id=near.id;dialog(near.label,id==='flower'?'Hoa cần ánh sáng và nước để lớn lên.':'Cây xanh cho chúng ta bóng mát và không khí trong lành.',[['Ghi vào sổ khám phá',()=>{state.anClues.push(id);state.anComplete=state.anClues.length===2;save();if(state.anComplete)dialog('🎉 Xuất sắc!','Em nhận thêm 40 XP. Tổng cộng 100 XP và lên cấp 2!')}] ]);return}
if(near.id==='milo'){if(!state.started)dialog('🦉 Milo','Chào mừng em! Tìm sách gần thư viện và bảng câu đố trước tòa nhà học nhé.',[['Nhận nhiệm vụ',()=>{state.started=true;save()}]]);else dialog('🦉 Milo',state.complete?'Em đã hoàn thành nhiệm vụ. Tuyệt vời!':'Hãy tìm đủ hai manh mối nhé.');return}if(!state.started){dialog('Chưa có nhiệm vụ','Em cần gặp Milo để nhận nhiệm vụ trước.');return}if(state.clues.includes(near.id)){dialog('Đã tìm thấy','Em đã thu thập manh mối này rồi.');return}const id=near.id;dialog(near.label,id==='book'?'Manh mối: Đọc sách giúp chúng ta khám phá thế giới.':'Manh mối: Học cùng bạn bè rất vui.',[['Thu thập',()=>{state.clues.push(id);state.complete=state.clues.length===2;save();if(state.complete)dialog('🎉 Chúc mừng!','Em đã hoàn thành nhiệm vụ đầu tiên và nhận 60 XP (bản thử nghiệm).')} ]])}
document.getElementById('action').onclick=interact;const keys=new Set();addEventListener('keydown',e=>{keys.add(e.key.toLowerCase());if(e.key===' '){e.preventDefault();interact()}});addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));
const pad=document.getElementById('pad'),stick=document.getElementById('stick'),joy={x:0,y:0};function pointer(e){const r=pad.getBoundingClientRect(),x=e.clientX-r.left-r.width/2,y=e.clientY-r.top-r.height/2,scale=Math.min(1,45/Math.max(1,Math.hypot(x,y)));joy.x=x*scale/45;joy.y=y*scale/45;stick.style.transform='translate('+joy.x*45+'px,'+joy.y*45+'px)'}pad.onpointerdown=e=>{pad.setPointerCapture(e.pointerId);pointer(e)};pad.onpointermove=e=>{if(pad.hasPointerCapture(e.pointerId))pointer(e)};function reset(){joy.x=joy.y=0;stick.style.transform=''}pad.onpointerup=reset;pad.onpointercancel=reset;pad.onlostpointercapture=reset;addEventListener('blur',()=>{keys.clear();reset()});
function blocked(x,z){return Math.abs(x)>43||Math.abs(z)>43||Math.hypot(x,z-13)<4.1||walls.some(b=>Math.abs(x-b.x)<b.w/2+.65&&Math.abs(z-b.z)<b.d/2+.65)}
const clock=new THREE.Clock();function frame(){requestAnimationFrame(frame);const dt=Math.min(clock.getDelta(),.05),dx=joy.x+(keys.has('d')||keys.has('arrowright')?1:0)-(keys.has('a')||keys.has('arrowleft')?1:0),dz=joy.y+(keys.has('s')||keys.has('arrowdown')?1:0)-(keys.has('w')||keys.has('arrowup')?1:0),norm=Math.max(1,Math.hypot(dx,dz)),vx=dx/norm*8*dt,vz=dz/norm*8*dt;if(!blocked(player.position.x+vx,player.position.z))player.position.x+=vx;if(!blocked(player.position.x,player.position.z+vz))player.position.z+=vz;if(Math.hypot(vx,vz)>.001)player.rotation.y=Math.atan2(vx,vz);owl.rotation.z=Math.sin(clock.elapsedTime*2)*.06;owl.position.y=1.2+Math.sin(clock.elapsedTime*2)*.12;const target=new THREE.Vector3(player.position.x,1.4,player.position.z);camera.position.lerp(target.clone().add(new THREE.Vector3(0,13,17)),.09);camera.lookAt(target);near=null;let dist=4;for(const p of points){const d=Math.hypot(player.position.x-p.x,player.position.z-p.z);if(d<dist){near=p;dist=d}}document.getElementById('action').style.opacity=near?'1':'.55';document.getElementById('tip').textContent=near?'Nhấn Tương tác: '+near.label:state.anComplete?'🎉 Hoàn thành 2 nhiệm vụ · Cấp 2':state.anStarted?'Tìm bông hoa và cây tri thức':state.complete?'Gặp cô An gần thư viện để nhận nhiệm vụ 2':state.started?'Tìm sách ở thư viện và bảng trước tòa nhà học':'Tìm Milo 🦉 gần đài phun nước';renderer.render(scene,camera)}frame();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
